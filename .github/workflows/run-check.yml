name: Syqnal Remote KiCad Audit

on:
  repository_dispatch:
    types: [trigger-audit]

jobs:
  kicad-check:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.2
    env:
      HOME: /tmp/syqnal-home
      XDG_CACHE_HOME: /tmp/syqnal-home/.cache
      XDG_CONFIG_HOME: /tmp/syqnal-home/.config
      XDG_DATA_HOME: /tmp/syqnal-home/.local/share

    steps:
      - name: Run KiCad checks
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/syqnal-results
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME/kicad/8.0/colors" "$XDG_DATA_HOME"
          cat > /tmp/payload.json <<'JSON'
          ${{ toJson(github.event.client_payload) }}
          JSON

          python3 - <<'PY'
          import json
          import subprocess
          import urllib.request
          from pathlib import Path

          payload = json.loads(Path("/tmp/payload.json").read_text())
          results = []

          def normalize_violation(v):
              severity = "warning" if v.get("severity") == "warning" else "error"
              return {
                  "type": v.get("type") or "violation",
                  "severity": severity,
                  "plain_text": v.get("description") or v.get("message") or "KiCad reported a violation.",
                  "items": v.get("items") or [],
              }

          for run in payload.get("runs", []):
              run_id = str(run.get("run_id") or "")
              check_type = str(run.get("type") or "").upper()
              file_url = run.get("file_url")
              file_path = run.get("file_path") or ""
              result = {
                  "run_id": run_id,
                  "type": check_type,
                  "file_path": file_path,
                  "status": "FAIL",
                  "tool": "kicad-cli",
                  "error_count": 1,
                  "warning_count": 0,
                  "violations": [],
              }

              try:
                  if check_type not in {"DRC", "ERC"}:
                      raise ValueError(f"Unsupported check type: {check_type}")
                  if not run_id or not file_url:
                      raise ValueError("Missing run id or file URL.")

                  suffix = ".kicad_pcb" if check_type == "DRC" else ".kicad_sch"
                  input_path = Path(f"/tmp/{run_id}{suffix}")
                  output_path = Path(f"/tmp/{run_id}.json")

                  with urllib.request.urlopen(file_url, timeout=60) as response:
                      input_path.write_bytes(response.read())

                  command = (
                      ["kicad-cli", "pcb", "drc", "--output", str(output_path), "--format", "json", "--exit-code-violations", str(input_path)]
                      if check_type == "DRC"
                      else ["kicad-cli", "sch", "erc", "--output", str(output_path), "--format", "json", "--exit-code-violations", str(input_path)]
                  )
                  completed = subprocess.run(command, text=True, capture_output=True)

                  if output_path.exists() and output_path.stat().st_size > 0:
                      report = json.loads(output_path.read_text())
                      violations = [normalize_violation(v) for v in report.get("violations", [])]
                  else:
                      message = completed.stderr.strip() or completed.stdout.strip() or "kicad-cli did not produce output."
                      violations = [{
                          "type": "runner_error",
                          "severity": "error",
                          "plain_text": message,
                          "items": [],
                      }]

                  errors = sum(1 for v in violations if v["severity"] != "warning")
                  warnings = sum(1 for v in violations if v["severity"] == "warning")
                  result.update({
                      "status": "PASS" if errors == 0 else "FAIL",
                      "error_count": errors,
                      "warning_count": warnings,
                      "violations": violations,
                  })
              except Exception as exc:
                  result["violations"] = [{
                      "type": "runner_error",
                      "severity": "error",
                      "plain_text": str(exc),
                      "items": [],
                  }]

              results.append(result)

          Path("/tmp/syqnal-results.json").write_text(json.dumps({"runs": results}))
          PY

      - name: Report results to Syqnal
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          payload = json.loads(Path("/tmp/payload.json").read_text())
          data = Path("/tmp/syqnal-results.json").read_bytes()
          request = urllib.request.Request(
              payload["callback_url"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {payload['callback_token']}",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              print(response.read().decode("utf-8", errors="replace"))
          PY
